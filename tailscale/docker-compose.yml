services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    network_mode: host
    environment:
      - TS_STATE_DIR=/var/lib/tailscale # Forces Tailscale to save to the disk
    cap_add:
      - net_admin
      - sys_module
    volumes:
      - /srv/tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
